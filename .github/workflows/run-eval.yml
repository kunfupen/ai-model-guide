name: Run AMG Eval

# Scores models on our own benchmark suite and opens a PR with the results.
#
# The self-test runs on every push (free, no keys) so a broken suite or grader
# can never reach main. The scored run is manual/opt-in because it spends real
# API credits.
on:
  push:
    paths:
      - "evals/**"
      - "scripts/**"
  pull_request:
    paths:
      - "evals/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      model:
        description: "Catalog slug to score (blank = every model in evals/models.json)"
        type: string
        required: false
      seed:
        description: "Suite seed — change it for a fresh, equally hard exam"
        type: string
        default: "20260724"
      record:
        description: "Write scores into the model pages and open a PR"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Always-on, free: proves every task is solvable and every grader is correct.
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Suite self-test (reference answers must score 100%)
        run: node evals/run-eval.mjs --self-test --seed ${{ inputs.seed || '20260724' }}

  score:
    needs: self-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      - name: Run the eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          node evals/run-eval.mjs \
            ${{ inputs.model && format('--model {0}', inputs.model) || '--all' }} \
            --seed ${{ inputs.seed }} \
            ${{ inputs.record && '--record' || '' }}

      - name: Validate the catalog still builds
        run: pnpm build

      - name: Open a PR with the scores
        if: inputs.record
        uses: peter-evans/create-pull-request@v6
        with:
          branch: eval/amg-scores-${{ github.run_number }}
          title: "AMG Eval results (seed ${{ inputs.seed }})"
          commit-message: "Record AMG Eval scores (seed ${{ inputs.seed }})"
          labels: benchmarks
          body: |
            Automated AMG Eval run.

            - Suite seed: `${{ inputs.seed }}`
            - Target: `${{ inputs.model || 'all registered models' }}`
            - Raw per-task results are committed under `evals/results/`.

            Scores are only recorded for runs with **zero API-layer failures** —
            a model that errored mid-run is skipped rather than scored low.

            Methodology: `evals/README.md`.
