[project]
name = "modelpilot"
version = "0.1.0"
description = "A ReAct agent that recommends AI models, grounded in the ai-model-guide catalog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "tenacity>=9.0",
    "httpx>=0.28",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
    "rich>=13.9",
    "typer>=0.15",
    "ddgs>=9.0",
    "selectolax>=0.3.21",
]

[project.scripts]
modelpilot = "modelpilot.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelpilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
